document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        if (!entry.compressed && entry.mime.indexOf('image/') === 0) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' + entry.data;
          return;
        }
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:4200, hold:63000, src:'https://reidasofficial.lt/straipsniai/bauda-uz-stovejima-neleistinoje-vietoje/', sl:'reidasofficial.lt \\u2197'},\n    {n:'Luxembourg', from:145, up:145, def:145, spaces:1000, hold:14500, src:'https://www.lesfrontaliers.lu/fiscalite/145eu-damende-pour-mauvais-stationnement/', sl:'police.public.lu \\u2197'},\n    {n:'Malta', from:230, up:500, def:230, spaces:800, hold:12000, src:'https://sapport.gov.mt/wp-content/uploads/2025/04/Blue-Badge-Your-Go-To-Guide.pdf', sl:'sapport.gov.mt \\u2197'},\n    {n:'Netherlands', from:400, up:500, def:400, spaces:26100, hold:392000, src:'https://www.mreo.nl/boete-parkeren-op-een-gehandicaptenparkeerplaats/', sl:'OM boetebase \\u2197'},\n    {n:'Poland', from:185, up:185, def:185, spaces:54000, hold:810000, src:'https://parking.pl/mandat-za-parkowanie-na-miejscu-dla-niepelnosprawnych-2025/', sl:'taryfikator \\u2197'},\n    {n:'Portugal', from:60, up:300, def:300, spaces:15100, hold:227000, src:'https://auto.sapo.pt/noticias/68697e51bc74350e6595d8b0/nao-pare-nem-estacione-num-lugar-para-deficientes-atencao-as-coimas', sl:'CdE art.145 \\u2197'},\n    {n:'Romania', from:400, up:2000, def:400, spaces:27900, hold:418000, src:'https://www.automarket.ro/stiri/amenda-minima-pentru-parcarea-pe-locurile-rezervate-persoanelor-cu-handicap-99285.html', sl:'Legea 448/2006 \\u2197'},\n    {n:'Slovakia', from:132, up:198, def:132, spaces:5500, hold:110000, anchor:true, src:'https://www.startitup.sk/slovenski-vodici-casto-riskuju-200-eurovu-pokutu-na-istych-miestach-rozhodne-nezastavuj/', sl:'sadzobn\\u00edk \\u2197'},\n    {n:'Slovenia', from:200, up:200, def:200, spaces:3100, hold:47000, src:'https://zon.si/poostreno-nad-parkiranje-na-mestih-za-invalide-kazen-iz-80-na-200-evrov/', sl:'ZPrCP art.67 \\u2197'},\n    {n:'Spain', from:100, up:200, def:100, spaces:70400, hold:1056000, src:'https://www.cuatro.com/noticias/espana/20250429/multa-aparcar-plaza-minusvalidos_18_015247283.html', sl:'RGC / DGT \\u2197'},\n    {n:'Sweden', from:90, up:115, def:115, spaces:15400, hold:231000, src:'https://www.eskilstuna.se/trafik-och-gator/parkering/felparkering', sl:'felparkering \\u2197'}\n  ];\n\n  state = { countryIdx: 4, fine: 300, fpsm: 1 };\n\n  componentDidMount() {\n    const sc = this.props.startCountry;\n    if (sc) {\n      const i = this.data.findIndex(c => c.n === sc);\n      if (i >= 0) this.setState({ countryIdx: i, fine: this.data[i].def });\n    }\n  }\n\n  onCountry = (e) => {\n    const i = parseInt(e.target.value, 10) || 0;\n    this.setState({ countryIdx: i, fine: this.data[i].def });\n  };\n  onFine = (e) => this.setState({ fine: Math.max(0, parseFloat(e.target.value) || 0) });\n  onFpsm = (e) => this.setState({ fpsm: Math.max(0, parseFloat(e.target.value) || 0) });\n\n  renderVals() {\n    const fmt = n => '\\u20ac' + Math.round(n).toLocaleString('en-GB');\n    const fmt0 = n => Math.round(n).toLocaleString('en-GB');\n    const benchmark = Number(this.props.benchmark != null ? this.props.benchmark : 600) || 600;\n    const idx = this.state.countryIdx != null ? this.state.countryIdx : 4;\n    const c = this.data[idx] || this.data[4];\n    const fine = this.state.fine != null ? this.state.fine : c.def;\n    const fpsm = this.state.fpsm != null ? this.state.fpsm : 1;\n\n    const finesYr = Math.round(fpsm * 12 * 100) / 100;\n    const perSpace = fpsm * 12 * fine;\n    const ratio = benchmark > 0 ? perSpace / benchmark : 0;\n    const meets = perSpace >= benchmark;\n\n    const max = (Math.max(perSpace, benchmark) * 1.08) || 1;\n    const mineW = Math.max(9, (perSpace / max) * 100);\n    const baseW = Math.max(9, (benchmark / max) * 100);\n\n    const barBase = {\n      height: '30px', borderRadius: '7px', display: 'flex', alignItems: 'center',\n      padding: '0 12px', color: '#fff', fontSize: '13px', fontWeight: 700,\n      whiteSpace: 'nowrap', overflow: 'hidden', marginBottom: '8px',\n      minWidth: '92px', transition: 'width .3s ease'\n    };\n    const mineBarStyle = { ...barBase, width: mineW + '%', background: '#034EA2' };\n    const baseBarStyle = { ...barBase, width: baseW + '%', background: '#CBD2DB', color: '#142033', fontWeight: 700 };\n\n    let verdictStyle, verdictText;\n    if (meets) {\n      verdictStyle = {\n        fontSize: '13px', fontWeight: 600, borderRadius: '9px', padding: '11px 13px',\n        marginTop: '6px', lineHeight: 1.5, background: '#EAF3E1', color: '#2F6B12'\n      };\n      verdictText = '\\u2713 ' + ratio.toFixed(1) + '\\u00d7 the proposal\\u2019s conservative ' + fmt(benchmark) + '/space/year. At this enforcement intensity, recovered fine revenue fully funds operations and underpins the Enforcement-as-a-Service / concession model.';\n    } else {\n      verdictStyle = {\n        fontSize: '13px', fontWeight: 600, borderRadius: '9px', padding: '11px 13px',\n        marginTop: '6px', lineHeight: 1.5, background: '#FCEFE0', color: '#A65616'\n      };\n      verdictText = (ratio * 100).toFixed(ratio < 0.1 ? 1 : 0) + '% of the ' + fmt(benchmark) + '/space/year benchmark \\u2014 ' + fmt(benchmark - perSpace) + '/space short. At this intensity, IncluPark360\\u2019s continuous digital detection raises the catch rate toward ' + fmt(benchmark) + '+ and beyond.';\n    }\n\n    return {\n      countryIdx: String(idx),\n      countryOptions: this.data.map((d, i) => ({ i: String(i), n: d.n })),\n      onCountry: this.onCountry, onFine: this.onFine, onFpsm: this.onFpsm,\n      fine, fpsm,\n      fineHint: 'Auto-filled \\u20ac' + c.def + ' \\u00b7 national range \\u20ac' + c.from + '\\u2013\\u20ac' + c.up + ' \\u00b7 editable',\n      perSpaceStr: fmt(perSpace),\n      formula: fpsm.toLocaleString('en-GB') + '/space/month \\u00d7 12 \\u00d7 ' + fmt(fine) + '  (' + finesYr.toLocaleString('en-GB') + ' fines/space/year)',\n      benchmarkStr: fmt(benchmark),\n      mineBarStyle, baseBarStyle,\n      mineLabel: 'Yours: ' + fmt(perSpace) + ' / 1 parking space',\n      baseLabel: 'Proposal assumption: ' + fmt(benchmark) + ' / 1 parking space',\n      verdictStyle, verdictText,\n      tableRows: this.data.map(d => ({\n        n: d.n, spacesStr: fmt0(d.spaces), holdStr: fmt0(d.hold),\n        fromStr: '\\u20ac' + d.from, upStr: '\\u20ac' + d.up, src: d.src, sl: d.sl, anchor: !!d.anchor\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
